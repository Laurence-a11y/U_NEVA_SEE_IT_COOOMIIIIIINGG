  for (const h of hz) {
    for (const row of rows) {
      win.push({ x: h.x, t0: (row - BALL_R - (h.y + HAZ)) / v, t1: (row + BALL_R - h.y) / v });
    }
  }
  const tEnd = Math.max.apply(null, win.map(w => w.t1));
  for (let t = STEP; t <= tEnd + STEP; t += STEP) {
    nxt.fill(0);
    for (let i = 0; i < n; i++) {
      if (!cur[i]) continue;
      for (let d = -reach; d <= reach; d++) { const j = i + d; if (j >= 0 && j < n) nxt[j] = 1; }
    }
    for (const w of win) {
      if (t > w.t0 && t < w.t1) {
        const lo = Math.max(0, Math.ceil((w.x - (HAZ / 2 + BALL_R) - minX) / CELL));
        const hi = Math.min(n - 1, Math.floor((w.x + HAZ / 2 + BALL_R - minX) / CELL));
        for (let j = lo; j <= hi; j++) nxt[j] = 0;
      }
    }
    let any = 0;
    for (let i = 0; i < n; i++) any |= nxt[i];
    if (!any) return false;
    const tmp = cur; cur = nxt; nxt = tmp;
  }
  return true;
}

function spawnWave() {
  const v = fallSpeed(score);
  // while a lunging bug/malware is active, only skills spawn so the dodge stays fair
  if (ents.some(e => e.lunger)) { ents.push(makeSkill(randX(SKILL_W / 2), FIELD.y - SKILL_H)); return; }
  const live = ents.filter(e => e.kind === 'hazard');
  const rows = ball.rise ? [BALL_Y0, BALL_Y0 - RISE_PX] : [BALL_Y0];
  for (let attempt = 0; attempt < 8; attempt++) {
    const g = buildGroup();
    const gh = g.filter(e => e.kind === 'hazard');
    if (!gh.length || survivable(live.concat(gh), v, rows)) { ents.push.apply(ents, g); return; }
  }
  ents.push(makeSkill(randX(SKILL_W / 2), FIELD.y - SKILL_H));   // fallback: no hazard this wave
}

/* ---------- state transitions ---------- */
function startGame() {
  score = 0; rankIdx = 0; ents = []; popups = []; banner = null; over = null;
  ball.x = FIELD.x + FIELD.w / 2; ball.flash = 0; ball.y = BALL_Y0; ball.rise = null;
  rage = { next: null, pending: null, waited: 0 };

}

/* ---------- rage events (from RAGE_FROM_SCORE) ---------- */
// One hazard may "lunge": it shakes (the tell), then dives fast and chases the ball's
// position sideways a little. The ball may "rise": it jumps up, hovers, then drops back.
// A third event does both at once. Every event is checked for dodgeability first.
function stepHazard(e, lg, dt, v, bx, by) {
  if (!lg) { e.y += v * dt; return; }
  if (!lg.go) {
    if (!lg.warning) {
      e.y += v * dt;
      if (by - (e.y + HAZ / 2) <= LUNGE_WARNING_DISTANCE) {
        lg.warning = true;
        lg.t = 0;
      }
      return;
    }
    lg.t += dt;
    if (lg.t >= LUNGE_SHAKE) lg.go = true;
    return;
  }
  e.y += LUNGE_SPEED * dt;
  if (by - (e.y + HAZ / 2) > LUNGE_LOCK_GAP) {              // still chasing sideways
    const dx = bx - e.x, step = LUNGE_TRACK * dt;
    e.x += Math.abs(dx) <= step ? dx : Math.sign(dx) * step;
  }
}

// Fairness check: replays the event with a player who reacts after RAGE_REACT seconds
// and runs one way (or stays put). The event only starts if one of those survives.
function simRage(wantRise, lunger, v, dir) {
  const hz = ents.filter(e => e.kind === 'hazard')
    .map(e => ({ x: e.x, y: e.y, l: e === lunger ? { t: 0, go: false } : null }));
  if (lunger && ents.indexOf(lunger) === -1) hz.push({ x: lunger.x, y: lunger.y, l: { t: 0, go: false } });
  const minX = FIELD.x + BALL_R, maxX = FIELD.x + FIELD.w - BALL_R, STEP = 1 / 60;
  let bx = ball.x;
  for (let t = STEP; t < 2.2; t += STEP) {
    if (t >= RAGE_REACT) bx = clamp(bx + dir * PLAYER_SPEED * STEP, minX, maxX);
    const by = wantRise ? BALL_Y0 - RISE_PX * Math.min(1, t / RISE_UP) : BALL_Y0;
    for (const h of hz) {
      stepHazard(h, h.l, STEP, v, bx, by);
      if (circleRect(bx, by, BALL_R - 1, h.x - HAZ / 2 + 3, h.y + 3, HAZ - 6, HAZ - 6)) return false;
    }
  }
  return true;
}
function startRage(type) {
  const hasLunger = ents.some(e => e.lunger);
  // Lunge and rise are independent events: either can start while the other is active.
  // Only a duplicate of the same event is blocked; a combo needs both slots free.
  if (type === 'lunge' && hasLunger) return false;
  if (type === 'rise' && ball.rise) return false;
  if (type === 'combo' && (hasLunger || ball.rise)) return false;
  const wantRise = type !== 'lunge', wantLunge = type !== 'rise';
  const v = fallSpeed(score);
  let lunger = null, fresh = false;
  if (wantLunge) {
    const row = wantRise ? BALL_Y0 - RISE_PX : BALL_Y0;
    const cands = ents.filter(e => e.kind === 'hazard' && e.y >= FIELD.y - HAZ &&
      row - (e.y + v * LUNGE_SHAKE + HAZ / 2) >= LUNGE_LOCK_GAP + 40);
    if (cands.length) lunger = cands[Math.floor(Math.random() * cands.length)];
    else { lunger = makeHazard(randX(HAZ / 2), FIELD.y - HAZ); fresh = true; }
  }
  // Rage events are time-scheduled and must not be silently suppressed by the predictive fairness simulation.
  if (fresh) ents.push(lunger);
  if (lunger) lunger.lunger = { t: 0, go: false };
  if (wantRise) ball.rise = { phase: 'up', t: 0 };
  return true;
}
function updateRage(dt) {
  if (score < RAGE_FROM_SCORE) {
    rage.next = null;
    rage.pending = null;
    rage.waited = 0;
    return;
  }
  if (rage.next === null) rage.next = RAGE_FIRST_DELAY;
  if (!rage.pending) {
    rage.next -= dt;
    if (rage.next > 0) return;
    const roll = Math.random();
    rage.pending = roll < 0.50 ? 'lunge' : roll < 0.80 ? 'combo' : 'rise';
    rage.waited = 0;
  }
  rage.waited += dt;
  // Keep each event type faithful to its roll: a tracking lunge must never turn into a rise.
  if (startRage(rage.pending)) {
    rage.pending = null;
    rage.next = rand(RAGE_INTERVAL[0], RAGE_INTERVAL[1]);
  } else if (rage.waited > 3) {
    // Retry the same event shortly instead of silently replacing it with another type.
    rage.waited = 0;
    rage.next = 0.25;
  }
}

// The ball must not drop onto a hazard: wait (up to RISE_MAX_WAIT) until its column is clear.
function dropClear() {
  for (const e of ents) {
    if (e.kind !== 'hazard') continue;
    if (Math.abs(e.x - ball.x) < HAZ / 2 + BALL_R + 10 &&
        e.y + HAZ > ball.y - BALL_R - 70 && e.y < BALL_Y0 + BALL_R) return false;
  }
  return true;
}
function updateRise(dt) {
  const r = ball.rise;
  if (!r) { ball.y = BALL_Y0; return; }
  r.t += dt;
  if (r.phase === 'up') {
    ball.y = BALL_Y0 - RISE_PX * Math.min(1, r.t / RISE_UP);
    if (r.t >= RISE_UP) { r.phase = 'hold'; r.t = 0; }
  } else if (r.phase === 'hold') {
    ball.y = BALL_Y0 - RISE_PX;
    if (r.t >= RISE_HOLD) { r.phase = 'wait'; r.t = 0; }
  } else if (r.phase === 'wait') {
    ball.y = BALL_Y0 - RISE_PX;
    if (dropClear() || r.t >= RISE_MAX_WAIT) { r.phase = 'down'; r.t = 0; }
  } else {
    ball.y = BALL_Y0 - RISE_PX * (1 - Math.min(1, r.t / RISE_DOWN));
    if (r.t >= RISE_DOWN) {
  ball.rise = null;
  ball.y = BALL_Y0;

  if (state === 'playing') {
    score += RAGE_DODGE_REWARD;
    popups.push({
      x: ball.x,
      y: ball.y - 20,
      text: '+500 DODGE!',
      t: 0
    });

    const ri = rankIndex(score);
    if (ri > rankIdx) {
      rankIdx = ri;
      banner = { idx: ri, t: 2.2 };
    }
  }
}
  }
}

/* ---------- cutscene (plays after a rage-event hit, then Game Over) ---------- */
function startCutscene() {
  state = 'cutscene';
  cut.t = 0; cut.started = false;
  vid.style.display = 'block';
  try { vid.currentTime = 0; } catch (e) {}
  vid.muted = false;
  const fail = () => endCutscene();
  const attempt = () => {
    let p;
    try { p = vid.play(); } catch (e) { fail(); return; }
    if (p && p.catch) p.catch(() => {
      vid.muted = true;                                       // sound was blocked: try silently
      let q; try { q = vid.play(); } catch (e) { fail(); return; }
      if (q && q.catch) q.catch(fail);
    });
  };
  attempt();
}
function endCutscene() {
  if (state !== 'cutscene') return;
  try { vid.pause(); } catch (e) {}
  vid.style.display = 'none';
  state = 'gameover';
}
function updateCutscene(dt) {
  cut.t += dt;
  const cap = (isFinite(vid.duration) && vid.duration > 0 ? vid.duration : 30) + 5;
  if ((!cut.started && cut.t > CUTSCENE_START_TIMEOUT) || cut.t > cap) endCutscene();
}
vid.src = CUTSCENE_SRC;
vid.preload = 'auto';
vid.addEventListener('playing', () => { cut.started = true; });
vid.addEventListener('ended', endCutscene);
vid.addEventListener('error', () => { if (state === 'cutscene') endCutscene(); });

function endGame(hazard) {
  const rageHit = !!(hazard.lunger || ball.rise);            // a rage event caused this hit
  const prevBest = best;
  const newHigh = score > prevBest;
  if (newHigh) { best = score; store.set(KEY_BEST, String(best)); }
  if (score > 0) {
    top5.push(score);
    top5.sort((a, b) => b - a);
    top5 = top5.slice(0, 5);
    store.set(KEY_TOP5, JSON.stringify(top5));
  }
  over = { score, prevBest, newHigh, rank: rankIndex(score), phrase: hazard.def.phrase };
  if (rageHit) startCutscene(); else state = 'gameover';
}
function toTitle() { state = 'title'; }
function showHowTo() { state = 'howto'; }

/* ---------- per-frame update ---------- */
function update(dt) {
  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  ball.x = clamp(ball.x + dir * PLAYER_SPEED * dt, FIELD.x + BALL_R, FIELD.x + FIELD.w - BALL_R);
  if (ball.flash > 0) ball.flash -= dt;
  updateRage(dt);
  updateRise(dt);

  spawnTimer -= dt;
  if (spawnTimer <= 0) { spawnWave(); spawnTimer += spawnInterval(score); }

  const v = fallSpeed(score);
  for (const e of ents) {
    if (e.kind === 'hazard') stepHazard(e, e.lunger, dt, v, ball.x, ball.y);
    else e.y += v * dt;
  }

  // hazards first: any hit ends the run immediately
  for (const e of ents) {
    if (e.kind !== 'hazard') continue;
    if (circleRect(ball.x, ball.y, BALL_R - 1, e.x - HAZ / 2 + 3, e.y + 3, HAZ - 6, HAZ - 6)) { endGame(e); return; }
  }
  for (const e of ents) {
  if (
    e.kind === 'hazard' &&
    e.lunger &&
    e.lunger.go &&
    e.y > ball.y + BALL_R &&
    !rewardedLunges.has(e)
  ) {
    rewardedLunges.add(e);
    score += RAGE_DODGE_REWARD;

    popups.push({
      x: ball.x,
      y: ball.y - 20,
      text: '+500 DODGE!',
      t: 0
    });

    const ri = rankIndex(score);
    if (ri > rankIdx) {
      rankIdx = ri;
      banner = { idx: ri, t: 2.2 };
    }
  }
}
  // collectibles
  for (let i = ents.length - 1; i >= 0; i--) {
    const e = ents[i];
    if (e.kind !== 'skill') continue;
    if (circleRect(ball.x, ball.y, BALL_R, e.x - SKILL_W / 2, e.y, SKILL_W, SKILL_H)) {
      const pts = TIERS[e.tier].points;
      score += pts;
      popups.push({ x: e.x, y: e.y, text: '+' + pts, t: 0 });
      ball.flash = 0.12;
      ents.splice(i, 1);
      const ri = rankIndex(score);
      if (ri > rankIdx) { rankIdx = ri; banner = { idx: ri, t: 2.2 }; }
    }
  }
  ents = ents.filter(e => e.y < FIELD.y + FIELD.h + 4);

  for (const p of popups) p.t += dt;
  popups = popups.filter(p => p.t < 0.6);
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
}

const tri   = (p, m) => { const q = ((p % (2 * m)) + 2 * m) % (2 * m); return q < m ? q : 2 * m - q; };
const wrapN = (v, n) => ((v % n) + n) % n;

};

function drawBackdropFX(kind) {
  const L = FX_LAYOUT[kind];
  L.clouds.forEach((cy, i) => {
    ctx.drawImage(CLOUD, Math.round(wrapN(i * 110 + (8 + i * 4) * T, W + 60) - 40), cy);
  });
  for (const e of EMBERS) {

    ctx.fillStyle = e.c;

  ctx.drawImage(CRITTERS.jelly[Math.floor(T * 3) % 2],
    Math.round(J.x + Math.sin(T * 0.7) * J.sway - 12), Math.round(J.top + tri(T * 14, J.bottom - J.top)));
}

  y += 26;
  for (const line of wrap('You were hit by ' + over.phrase + '!', 266)) { txt(line, 160, y, { align: 'center' }); y += 11; }
  txt('Your IT journey continues!', 160, y, { align: 'center' });
  y += 20;
  txt('SCORE ' + pad6(over.score), 160, y, { align: 'center' }); y += 12;
  txt('BEST  ' + pad6(best), 160, y, { align: 'center' }); y += 12;
  if (over.newHigh) {
    if (Math.floor(T * 3) % 2) txt('NEW HIGH SCORE!', 160, y, { align: 'center', color: C.red });
    y += 12;
  }
  y += 6;
  drawEmblem(over.rank, 28, y, true);
  const nameLines = wrap(RANKS[over.rank].name.toUpperCase(), 224);
  let ny = y + 16 - nameLines.length * 6;
  for (const line of nameLines) { txt(line, 68, ny, { color: C.red }); ny += 12; }
  y += 40;
  for (const line of wrap('Congratulations! You have reached the rank of ' + RANKS[over.rank].name + '!', 270)) {
    txt(line, 160, y, { align: 'center' }); y += 11;
  }
  btn('again', 'TRY AGAIN', 80, 262, 160, 22);
  btn('title', 'RETURN TO TITLE', 80, 288, 160, 22);
}

function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.imageSmoothingEnabled = false;
  buttons = [];
  if (state === 'title') renderTitle();
  else if (state === 'howto') renderHowTo();
  else if (state === 'gameover') renderGameOver();
  else renderPlaying();
  canvas.style.cursor = buttons.some(b => mouse.x >= b.x && mouse.x < b.x + b.w && mouse.y >= b.y && mouse.y < b.y + b.h) ? 'pointer' : 'default';
}

/* =====================================================================
   INPUT
   ===================================================================== */
const GAME_KEYS = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'];

window.addEventListener('keydown', e => {
  if (GAME_KEYS.indexOf(e.code) !== -1) e.preventDefault();   // stop page scrolling
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
  else if (e.code === 'Space' && !e.repeat) {
    if (state === 'title' || state === 'gameover') startGame();
  }
});
window.addEventListener('keyup', e => {
  if (GAME_KEYS.indexOf(e.code) !== -1) e.preventDefault();
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});
window.addEventListener('blur', () => { keys.left = false; keys.right = false; });

function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - canvas.clientLeft) / canvas.clientWidth * W,
    y: (e.clientY - r.top - canvas.clientTop) / canvas.clientHeight * H
  };
}
canvas.addEventListener('pointermove', e => { mouse = toLogical(e); });
canvas.addEventListener('pointerleave', () => { mouse = { x: -1, y: -1 }; });
canvas.addEventListener('click', e => {
  const p = toLogical(e);
  mouse = p;
  for (const b of buttons) {
    if (p.x >= b.x && p.x < b.x + b.w && p.y >= b.y && p.y < b.y + b.h) {
      if (b.id === 'start' || b.id === 'again') startGame();
      else if (b.id === 'how') showHowTo();
      else if (b.id === 'back' || b.id === 'title') toTitle();
      break;
    }
  }
});

/* =====================================================================
   SCALING + MAIN LOOP
   ===================================================================== */
function resize() {
  const margin = 12 + 16;                                   // border + breathing room
  let s = Math.min((window.innerWidth - margin) / W, (window.innerHeight - margin) / H);
  if (s >= 1) s = Math.floor(s);                            // integer scale keeps pixels crisp
  s = Math.max(s, 0.5);
  const dpr = window.devicePixelRatio || 1;
  scale = Math.max(1, Math.round(s * dpr));
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
  canvas.width = W * scale;
  canvas.height = H * scale;
}
window.addEventListener('resize', resize);
resize();

if (document.fonts && document.fonts.load) {
  try { document.fonts.load('8px "Press Start 2P"'); document.fonts.load('16px "Press Start 2P"'); } catch (e) {}
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  T += dt;
  if (state === 'playing') update(dt);
  else if (state === 'cutscene') updateCutscene(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
